<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen-Man File Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Sidebar Hover Trigger Zone -->
        <div class="sidebar-trigger-zone"></div>

        <!-- Sidebar: Navigation places, Bookmarks, and Mounts -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Zen-Man</h2>
            </div>
            
            <div class="sidebar-section-title">Places</div>
            <nav id="sidebar-places" class="sidebar-nav"></nav>
            
            <div class="sidebar-section-title">
                <span>Bookmarks</span>
                <button id="btn-add-bookmark" class="btn-sidebar-action" title="Add Current to Bookmarks">+</button>
            </div>
            <nav id="sidebar-bookmarks" class="sidebar-nav"></nav>
            
            <div class="sidebar-section-title">Mounted Drives</div>
            <nav id="sidebar-mounts" class="sidebar-nav"></nav>
        </aside>

        <!-- Main Window Container -->
        <main class="main-window">
            <!-- Global Workspace & Split control Header -->
            <header class="global-header">
                <div class="workspace-section">
                    <span class="workspace-label">Workspace:</span>
                    <select id="workspace-select" class="workspace-select" aria-label="Workspaces">
                        <option value="default">Default</option>
                    </select>
                    <button id="workspace-new-btn" class="btn-global" title="Create New Workspace">New</button>
                    <button id="workspace-delete" class="btn-global" title="Delete Workspace">Delete</button>

                    <div id="workspace-create-panel" style="display: none; align-items: center; gap: 5px;">
                        <input type="text" id="workspace-new-name" placeholder="Workspace name..." style="background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; outline: none; width: 140px;">
                        <button id="workspace-confirm-save" class="btn-global btn-accent" style="padding: 4px 8px;" title="Confirm Save">✓</button>
                        <button id="workspace-cancel-save" class="btn-global" style="padding: 4px 8px;" title="Cancel">✗</button>
                    </div>
                    <span id="workspace-save-indicator" class="workspace-save-indicator">✓ Saved</span>
                </div>
                <div class="global-actions">
                    <button id="split-toggle-btn" class="btn-global btn-accent" title="Toggle Split Dual View (F3)">Split View (F3)</button>
                </div>
            </header>

            <!-- Dual Pane Container -->
            <div id="panes-container" class="panes-container single-pane">
                
                <!-- Left Pane -->
                <div id="pane-left" class="pane active-pane" tabindex="0">
                    <header class="toolbar">
                        <div class="toolbar-nav-buttons">
                            <button class="nav-back" title="Go Back" disabled>&larr;</button>
                            <button class="nav-forward" title="Go Forward" disabled>&rarr;</button>
                            <button class="nav-up" title="Go Up">&uarr;</button>
                        </div>
                        <div class="breadcrumb-container">
                            <input type="text" class="address-bar" value="/" style="display: none;">
                            <div class="breadcrumbs"></div>
                        </div>
                        <div class="toolbar-views">
                            <button class="btn-cycle-view" title="Switch to Grid View">&#9776;</button>
                        </div>
                    </header>

                    <div class="tabs-bar-container">
                        <div class="tabs-bar"></div>
                        <button class="btn-new-tab" title="New Tab">+</button>
                    </div>

                    <div class="file-view-container">
                        <div class="file-list-header">
                            <div class="col-name" data-sort="name">Name</div>
                            <div class="col-size" data-sort="size">Size</div>
                            <div class="col-date" data-sort="date">Modified</div>
                        </div>
                        <div class="file-list list-view" tabindex="0"></div>
                    </div>

                    <footer class="status-bar">
                        <span class="status-selection">0 items selected</span>
                        <span class="status-info">Loading...</span>
                    </footer>
                </div>

                <!-- Right Pane -->
                <div id="pane-right" class="pane" tabindex="0" style="display: none;">
                    <header class="toolbar">
                        <div class="toolbar-nav-buttons">
                            <button class="nav-back" title="Go Back" disabled>&larr;</button>
                            <button class="nav-forward" title="Go Forward" disabled>&rarr;</button>
                            <button class="nav-up" title="Go Up">&uarr;</button>
                        </div>
                        <div class="breadcrumb-container">
                            <input type="text" class="address-bar" value="/" style="display: none;">
                            <div class="breadcrumbs"></div>
                        </div>
                        <div class="toolbar-views">
                            <button class="btn-cycle-view" title="Switch to Grid View">&#9776;</button>
                        </div>
                    </header>

                    <div class="tabs-bar-container">
                        <div class="tabs-bar"></div>
                        <button class="btn-new-tab" title="New Tab">+</button>
                    </div>

                    <div class="file-view-container">
                        <div class="file-list-header">
                            <div class="col-name" data-sort="name">Name</div>
                            <div class="col-size" data-sort="size">Size</div>
                            <div class="col-date" data-sort="date">Modified</div>
                        </div>
                        <div class="file-list list-view" tabindex="0"></div>
                    </div>

                    <footer class="status-bar">
                        <span class="status-selection">0 items selected</span>
                        <span class="status-info">Loading...</span>
                    </footer>
                </div>

            </div>
        </main>

        <!-- Right Sidebar Hover Trigger Zone -->
        <div class="right-sidebar-trigger-zone"></div>

        <!-- Right Sidebar: Custom Actions Manager -->
        <aside class="right-sidebar" id="right-sidebar">
            <div class="sidebar-header" style="display:flex; justify-content:space-between; align-items:center;">
                <h2>Custom Actions</h2>
                <button id="btn-add-action" class="btn-sidebar-action" title="Add New Action">+</button>
            </div>
            
            <!-- Action Editor (hidden by default) -->
            <div id="action-editor" class="action-editor" style="display: none;">
                <div class="action-editor-field">
                    <label for="action-name">Name</label>
                    <input type="text" id="action-name" placeholder="e.g. Open in VS Code">
                </div>
                <div class="action-editor-field">
                    <label for="action-icon">Icon (Emoji)</label>
                    <input type="text" id="action-icon" placeholder="🖥️" maxlength="2" class="action-icon-input">
                </div>
                <div class="action-editor-field">
                    <label for="action-command">Command</label>
                    <input type="text" id="action-command" placeholder="Click tokens below...">
                    <div class="action-variables">
                        <span class="var-chip" data-var="{file}">{file}</span>
                        <span class="var-chip" data-var="{files}">{files}</span>
                        <span class="var-chip" data-var="{dir}">{dir}</span>
                        <span class="var-chip" data-var="{name}">{name}</span>
                        <span class="var-chip" data-var="{names}">{names}</span>
                        <span class="var-chip" data-var="{parent}">{parent}</span>
                    </div>
                </div>
                <div class="action-editor-field">
                    <label>Live Preview</label>
                    <div id="action-preview" class="action-preview">—</div>
                </div>
                <div class="action-editor-field">
                    <label>Applies to</label>
                    <div class="action-roles">
                        <label class="role-option"><input type="radio" name="action-role" value="both" checked> 📄📁 Files & Folders</label>
                        <label class="role-option"><input type="radio" name="action-role" value="files"> 📄 Files Only</label>
                        <label class="role-option"><input type="radio" name="action-role" value="dirs"> 📁 Folders Only</label>
                        <label class="role-option"><input type="radio" name="action-role" value="background"> 🖥️ Background</label>
                    </div>
                </div>
                <div class="action-editor-field">
                    <label for="action-patterns">File Patterns (e.g. *.js, *.png)</label>
                    <input type="text" id="action-patterns" placeholder="Leave blank for all">
                </div>
                <div class="action-editor-field checkbox-field" style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="action-show-output">
                    <label for="action-show-output" style="margin-bottom:0;">Show command output</label>
                </div>
                <div class="action-editor-buttons" style="display:flex; gap:10px; margin-top:15px;">
                    <button id="action-save-btn" class="btn-global btn-accent">Save</button>
                    <button id="action-cancel-btn" class="btn-global">Cancel</button>
                </div>
            </div>

            <!-- Action List Container -->
            <div id="action-list" class="sidebar-nav"></div>
        </aside>
    </div>

    <!-- Quick Find Modal -->
    <div id="quick-find-overlay" class="quick-find-overlay" style="display: none;">
        <div class="quick-find-modal">
            <div class="quick-find-header">
                <div class="quick-find-input-wrap">
                    <span class="quick-find-icon">🔍</span>
                    <input type="text" id="quick-find-input" placeholder="Type to find files..." autocomplete="off">
                </div>
                <label class="quick-find-recursive-toggle" title="Search all sub-folders recursively">
                    <input type="checkbox" id="quick-find-recursive">
                    <span>Recursive</span>
                </label>
            </div>
            <div class="quick-find-status">
                <span id="quick-find-count"></span>
                <span id="quick-find-path" class="quick-find-path-label"></span>
            </div>
            <div id="quick-find-results" class="quick-find-results"></div>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu" style="display: none;"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
