<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen-Man File Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Sidebar: Navigation places and bookmarks -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Zen-Man</h2>
            </div>
            <nav id="sidebar-places" class="sidebar-nav">
                <!-- Dynamically populated -->
            </nav>
        </aside>

        <!-- Main Window Container -->
        <main class="main-window">
            <!-- Toolbar: Back, Forward, Breadcrumbs, Search, View Mode -->
            <header class="toolbar">
                <div class="toolbar-nav-buttons">
                    <button id="nav-back" title="Go Back" disabled>&larr;</button>
                    <button id="nav-forward" title="Go Forward" disabled>&rarr;</button>
                    <button id="nav-up" title="Go Up">&uarr;</button>
                </div>
                <div id="breadcrumb-container" class="breadcrumb-container">
                    <input type="text" id="address-bar" class="address-bar" value="/" style="display: none;">
                    <div id="breadcrumbs" class="breadcrumbs"></div>
                </div>
                <div class="toolbar-search">
                    <input type="text" id="search-input" placeholder="Search..." aria-label="Search files">
                </div>
                <div class="toolbar-views">
                    <button id="view-list" class="active" title="List View">&#9776;</button>
                    <button id="view-grid" title="Grid View">&#9830;</button>
                </div>
            </header>

            <!-- Tabs container -->
            <div id="tabs-bar" class="tabs-bar">
                <!-- Dynamically populated tabs -->
            </div>

            <!-- Directory listing area -->
            <section class="file-view-container">
                <div id="file-list-header" class="file-list-header">
                    <div class="col-name" data-sort="name">Name</div>
                    <div class="col-size" data-sort="size">Size</div>
                    <div class="col-date" data-sort="date">Modified</div>
                </div>
                <div id="file-list" class="file-list list-view" tabindex="0">
                    <!-- File items populated dynamically -->
                </div>
            </section>

            <!-- Status Bar -->
            <footer class="status-bar">
                <span id="status-selection">0 items selected</span>
                <span id="status-info">Loading...</span>
            </footer>
        </main>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu" style="display: none;">
        <!-- Right click options populated dynamically -->
    </div>

    <script src="js/app.js"></script>
</body>
</html>
